type: custom:auto-entities
card:
  type: vertical-stack
card_param: cards
sort:
  method: attribute
  attribute: bis_datum
  reverse: false
filter:
  include:
    - entity_id: /^sensor\.marktguru_.*_\d+$/
      state: "!unavailable"
      options:
        type: custom:button-card
        entity: this.entity_id
        show_name: false
        show_icon: false
        show_state: false
        tap_action:
          action: fire-dom-event
          browser_mod:
            service: browser_mod.popup
            data:
              title: >
                [[[ return (entity.attributes.brand_name || '') + ' ' +
                (entity.attributes.product_name || ''); ]]]
              content:
                type: custom:mod-card
                card:
                  type: horizontal-stack
                  cards:
                    - type: custom:hui-element
                      card_type: picture
                      image: |
                        [[[ return entity.attributes.result_image_url || ''; ]]]
                      style: |
                        ha-card {
                          box-shadow: none;
                          background: none;
                          height: 50px;
                          width: 50px;
                          min-width: 50px;
                          min-height: 50px;
                          max-width: 50px;
                          max-height: 50px;
                          border-radius: 6px;
                          object-fit: contain;
                        }
                    - type: custom:hui-element
                      card_type: markdown
                      content: |
                        [[[
                          const badge = entity.attributes.price
                            ? `<img src="https://badgen.net/badge/Angebot/${encodeURIComponent(entity.attributes.price + ' €')}/green" height='22' style='vertical-align:middle'/>`
                            : '';
                          return `
                            <b>${entity.attributes.brand_name || ''} ${entity.attributes.product_name || ''}</b><br>
                            <span style="color:#888;font-size:9px">Referenzpreis ${entity.attributes.vergleichspreis || ''}</span><br> ${badge}<br>
                            <span style="color:#888">${entity.attributes.retailer_name || ''}</span>
                            ${entity.attributes.von_datum || ''} - ${entity.attributes.bis_datum || ''}<br>
                            <span>${entity.attributes.description || ''}</span>
                          `;
                        ]]]
                      style: |
                        ha-card {
                          box-shadow: none;
                          background: none;
                          margin-left: 12px;
                          font-size: 15px;
                        }
        styles:
          card:
            - padding: 8px
          grid:
            - grid-template-areas: "'img prod preis haendler datum'"
            - grid-template-columns: 60px 220px 120px 100px 110px
            - gap: 10px
            - align-items: center
          custom_fields:
            img:
              - grid-area: img
            prod:
              - grid-area: prod
              - justify-self: start
              - font-size: 14px
            preis:
              - grid-area: preis
              - font-family: monospace
              - font-size: 16px
              - justify-self: end
            haendler:
              - grid-area: haendler
              - justify-self: start
              - font-size: 12px
              - color: var(--secondary-text-color)
            datum:
              - grid-area: datum
              - justify-self: end
              - font-size: 12px
              - color: var(--primary-color)
              - text-decoration: underline
              - cursor: pointer
        custom_fields:
          img: |
            [[[
              if (entity.attributes.result_image_url) {
                return `<img src="${entity.attributes.result_image_url}" style="width: 50px; height: 50px; border-radius: 5px;">`;
              } else {
                return '';
              }
            ]]]
          prod: |
            [[[
              return `${entity.attributes.brand_name || ''} ${entity.attributes.product_name || ''}`;
            ]]]
          preis: |
            [[[
              if (entity.attributes.price) {
                const preisText = encodeURIComponent(String(entity.attributes.price) + ' €');
                const url = `https://badgen.net/badge/Angebot/${preisText}/green`;
                return `<img src="${url}">`;
              } else {
                return '';
              }
            ]]]
          haendler: |
            [[[
              return `🛒 ${entity.attributes.retailer_name || '-'}`;
            ]]]
          datum: |
            [[[
              const von = entity.attributes.von_datum || '?';
              const bis = entity.attributes.bis_datum || '?';
              return `<a style="color:var(--primary-color);text-decoration:underline;cursor:pointer;">${von} - ${bis}</a>`;
            ]]]
grid_options:
  columns: 24
  rows: 1
